name: Build and Push TarefasFlow Landing

on:
  push:
    branches:
      - staging
    paths:
      - "landingpage/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: tarefasflow-landing-production
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push landing image
        uses: docker/build-push-action@v6
        with:
          context: ./landingpage
          file: ./landingpage/Dockerfile
          push: true
          tags: ghcr.io/cleitonpcarvalho/tarefasflow-landing:latest
          cache-from: type=gha,scope=tarefasflow-landing
          cache-to: type=gha,mode=max,scope=tarefasflow-landing
          provenance: false
