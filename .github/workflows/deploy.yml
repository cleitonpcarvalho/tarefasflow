name: Build and Push Production Images

on:
  push:
    branches:
      - staging
    paths:
      - "backend/**"
      - "frontend/**"
      - "landingpage/**"
      - "docker-compose.prod.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ghcr.io/cleitonpcarvalho/tarefasflow/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/cleitonpcarvalho/tarefasflow/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push landing page
        uses: docker/build-push-action@v5
        with:
          context: ./landingpage
          file: ./landingpage/Dockerfile
          push: true
          tags: ghcr.io/cleitonpcarvalho/tarefasflow-landing:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer deploy
        run: |
          curl -s -X POST "${{ secrets.PORTAINER_WEBHOOK }}"
          echo "Deploy triggered"
