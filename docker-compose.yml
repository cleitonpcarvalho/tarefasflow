services:
  backend:
    image: ${BACKEND_IMAGE:-taskflow-backend:local}
    build:
      context: ./backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    networks:
      - taskflow-network

  frontend:
    image: ${FRONTEND_IMAGE:-taskflow-frontend:local}
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    networks:
      - taskflow-network

networks:
  taskflow-network:
    driver: bridge
